#===========================================================================
#
# This file is a part of the remake fnnas
# https://github.com/1737255535/fnnas
#
# Panther-X2(VPU+NPU), RK3566, 4GB-LPDDR4, 32G-eMMC, 64G-TF, 2x1Gb-Nic
# Reuses the standard Panther-X2 (RK3566) bootloader files and adds
# auto-loading of the Rockchip VPU/NPU kernel module set
# (rk_vcodec, rga3, rknpu and their dependencies) that ships in the
# kernel_fnnas rockchip tarball under updates/trim/rk_vcodec/.
#
# Reference: https://github.com/ophub/amlogic-s9xxx-armbian/issues/1319
#
#===========================================================================

# Reuse the Panther-X2 bootloader set (idbloader.img + u-boot.itb).
# The stock rockchip dd step runs before this function and skips silently
# because u-boot/rockchip/panther-x2-vpu does not exist in ophub/u-boot,
# so create the board dir and write the bootloader here.
write_board_file="yes"
write_board_bootloader() {
    local src="${uboot_path}/${PLATFORM}/panther-x2"
    [[ -d "${src}" ]] || {
        echo -e " [WARNING] Source u-boot dir [ ${src} ] not found, skipping bootloader write."
        return 0
    }
    mkdir -p "${uboot_path}/${PLATFORM}/${board}"
    cp -af --no-preserve=ownership "${src}/." "${uboot_path}/${PLATFORM}/${board}/"
    # Rockchip layout: idbloader @ offset 64 (512B units), u-boot.itb @ 16384
    dd if="${uboot_path}/${PLATFORM}/${board}/idbloader.img" of="${loop_new}" conv=fsync,notrunc bs=512 seek=64 2>/dev/null
    dd if="${uboot_path}/${PLATFORM}/${board}/u-boot.itb" of="${loop_new}" conv=fsync,notrunc bs=512 seek=16384 2>/dev/null
    echo -e " [INFO] For [ ${board} ] wrote bootloader from [ panther-x2 ] files."
}

# Adjust kernel files: make sure the VPU/NPU modules can be resolved and
# are auto-loaded at boot.
adjust_kernel_files="yes"
adjust_kernel_files_cmd() {
    local modbase="${tag_rootfs}/usr/lib/modules/${kernel_name}"
    local vdir="${modbase}/updates/trim/rk_vcodec"
    [[ -d "${vdir}" ]] || {
        echo -e " [WARNING] [ ${vdir} ] not found, skipping VPU/NPU module setup."
        return 0
    }

    # 1) Defensive: if this kernel build did not index the extra modules in
    #    modules.dep, append them (with verified dependency chains) and drop
    #    the stale binary index so kmod falls back to the text database.
    if ! grep -q "updates/trim/rk_vcodec/rk_vcodec.ko" "${modbase}/modules.dep" 2>/dev/null; then
        (
            cd "${modbase}" || exit 1
            {
                printf 'updates/trim/rk_vcodec/rockchip_sip.ko:\n'
                printf 'updates/trim/rk_vcodec/rockchip_pvtm.ko:\n'
                printf 'updates/trim/rk_vcodec/rockchip_opp_select.ko: updates/trim/rk_vcodec/rockchip_sip.ko updates/trim/rk_vcodec/rockchip_pvtm.ko\n'
                printf 'updates/trim/rk_vcodec/rockchip_system_monitor.ko: updates/trim/rk_vcodec/rockchip_opp_select.ko updates/trim/rk_vcodec/rockchip_sip.ko updates/trim/rk_vcodec/rockchip_pvtm.ko\n'
                printf 'updates/trim/rk_vcodec/rk_vcodec.ko: updates/trim/rk_vcodec/rockchip_system_monitor.ko updates/trim/rk_vcodec/rockchip_opp_select.ko updates/trim/rk_vcodec/rockchip_sip.ko updates/trim/rk_vcodec/rockchip_pvtm.ko\n'
                printf 'updates/trim/rk_vcodec/rga3.ko:\n'
                printf 'updates/trim/rk_vcodec/rknpu.ko: updates/trim/rk_vcodec/rockchip_system_monitor.ko updates/trim/rk_vcodec/rockchip_opp_select.ko updates/trim/rk_vcodec/rockchip_sip.ko updates/trim/rk_vcodec/rockchip_pvtm.ko\n'
            } >> modules.dep
            rm -f modules.dep.bin
            echo -e " [INFO] For [ ${board} ] appended VPU/NPU modules to modules.dep."
        )
    fi

    # 2) Auto-load the VPU/NPU modules at boot (systemd-modules-load).
    #    VPU = rk_vcodec (Rockchip video codec MFD) + rga3 (2D RGA engine),
    #    NPU = rknpu (RKNPU driver; the RK3566 SoC itself has no NPU silicon
    #    so the module simply binds nothing there, but the firmware stays
    #    ready and works unchanged on RK3568-family VPU devices and would
    #    activate the NPU on boards whose DTB exposes an NPU node).
    mkdir -p "${tag_rootfs}/etc/modules-load.d"
    cat > "${tag_rootfs}/etc/modules-load.d/90-rockchip-vpu-npu.conf" <<'LOADS'
rk_vcodec
rga3
rknpu
LOADS

    # 3) Keep hardware modalias entries so coldplug auto-load also works.
    (
        cd "${modbase}" || exit 1
        grep -q '^alias rockchip-rknpu rknpu$' modules.alias 2>/dev/null || echo 'alias rockchip-rknpu rknpu' >> modules.alias
        grep -q '^alias rockchip-rga3 rga3$' modules.alias 2>/dev/null || echo 'alias rockchip-rga3 rga3' >> modules.alias
        grep -q '^alias platform:rk-vcodec rk_vcodec$' modules.alias 2>/dev/null || echo 'alias platform:rk-vcodec rk_vcodec' >> modules.alias
    )

    echo -e " [INFO] For [ ${board} ] enabled VPU/NPU modules: rk_vcodec, rga3, rknpu."
}
